<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Демо — ТЯГА</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<script>
  // Тема до отрисовки, чтобы не мигало
  (function () {
    var t = null;
    try { t = localStorage.getItem('tyaga_demo_theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root{
  --bg:#ECEBE6; --panel:#FFFFFF; --text:#141414; --muted:#5C5950; --line:#DAD8D0;
  --chrome:#E4E2DC; --chip:#F3F2EE; --bezel:#141414; --shadow:0 18px 50px rgba(20,20,20,.14);
}
:root[data-theme="dark"]{
  --bg:#0B0B0A; --panel:#181817; --text:#ECEAE4; --muted:#A8A49A; --line:#2C2B28;
  --chrome:#222220; --chip:#262624; --bezel:#2E2D2A; --shadow:0 18px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer}

.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#141414;border-bottom:4px solid #FFD400;color:#fff;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:#fff;text-decoration:none}
.brand i{width:34px;height:34px;border-radius:7px;background:#FFD400;color:#141414;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px}
.brand span{font-size:13px;font-weight:700;color:#FFD400;letter-spacing:.5px}
.top p{margin:0;color:#BDB9AE;font-size:14px;flex:1;min-width:200px}
.theme{height:38px;padding:0 14px;border-radius:999px;border:2px solid #4A4A4A;background:transparent;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.theme:hover{border-color:#FFD400}
.theme svg{width:18px;height:18px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}

.stage{flex:1;min-height:0;display:flex;gap:22px;padding:20px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.col-pc{flex:1}
.col-phone{flex:none}
.bar{display:flex;align-items:center;gap:12px;min-height:40px;flex-wrap:wrap}
.bar h2{margin:0;font-size:15px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{height:34px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--text);font-weight:700;font-size:14px}
.seg button.on{background:#FFD400;color:#141414}
.tip{font-size:13px;color:var(--muted)}

.browser{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line)}
.chrome{display:flex;align-items:center;gap:12px;height:38px;padding:0 14px;background:var(--chrome);flex:none}
.dots{display:flex;gap:6px}
.dots b{width:11px;height:11px;border-radius:50%;background:#FF5F57}
.dots b:nth-child(2){background:#FEBC2E}
.dots b:nth-child(3){background:#28C840}
.url{flex:1;max-width:520px;height:24px;border-radius:6px;background:var(--chip);color:var(--muted);font-size:12px;display:flex;align-items:center;padding:0 10px;overflow:hidden;white-space:nowrap}
.screen{flex:1;min-height:0;position:relative;overflow:hidden;background:#F3F2EE}
.screen iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#F3F2EE}
:root[data-theme="dark"] .screen,:root[data-theme="dark"] .screen iframe{background:#0F0F0E}
.screen iframe[hidden]{display:none}

.phone{flex:none;position:relative;border-radius:46px;background:var(--bezel);padding:12px;box-shadow:var(--shadow);transform-origin:top center}
.phone::before{content:"";position:absolute;top:20px;left:50%;width:96px;height:26px;margin-left:-48px;border-radius:14px;background:#000;z-index:2}
.phone iframe{display:block;width:390px;height:844px;border:0;border-radius:35px;background:#F3F2EE}
:root[data-theme="dark"] .phone iframe{background:#0F0F0E}
.phone-box{flex:1;min-height:0;display:flex;justify-content:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#141414;color:#fff;border:2px solid #FFD400;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  body{height:auto}
  .stage{flex-direction:column;padding:16px}
  .browser{flex:none;height:62vh}
  .top p{order:3;flex-basis:100%}
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="../index.html" title="Открыть настоящий сайт"><i>🛠</i>ТЯГА <span>ДЕМО</span></a>
  <p>Сайт проката инструмента на компьютере и телефоне. Заявки и правки каталога в демо никуда не отправляются.</p>
  <button class="theme" id="theme" type="button" aria-label="Сменить тему">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span id="themeText">Тёмная тема</span>
  </button>
</header>

<main class="stage">
  <section class="col col-pc">
    <div class="bar">
      <h2>Компьютер</h2>
      <div class="seg" role="tablist" aria-label="Что показать">
        <button type="button" id="tabSite" class="on" role="tab" aria-selected="true">Сайт</button>
        <button type="button" id="tabAdmin" role="tab" aria-selected="false">Админ-панель</button>
      </div>
      <span class="tip" id="tip">Выберите инструмент и оформите заявку</span>
    </div>
    <div class="browser">
      <div class="chrome"><span class="dots"><b></b><b></b><b></b></span><span class="url" id="url">tyaga / index.html</span></div>
      <div class="screen" id="screen">
        <iframe id="pcSite" src="site/index.html" title="Сайт на компьютере"></iframe>
        <iframe id="pcAdmin" title="Админ-панель на компьютере" hidden></iframe>
      </div>
    </div>
  </section>

  <section class="col col-phone">
    <div class="bar"><h2>Телефон</h2></div>
    <div class="phone-box" id="phoneBox">
      <div class="phone" id="phone"><iframe id="mobile" src="site/index.html" title="Сайт на телефоне"></iframe></div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PC_W = 1440, PH_W = 414, PH_H = 868; // ширина «монитора» и размер телефона с рамкой
  var frames = [$('pcSite'), $('pcAdmin'), $('mobile')];
  var mode = 'site', toastTimer;

  function toast(text) {
    $('toast').textContent = text; $('toast').classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { $('toast').classList.remove('show'); }, 3200);
  }

  // Связь со страницами внутри рамок (js/demo.js)
  var demo = window.TYAGA_DEMO = {
    theme: document.documentElement.getAttribute('data-theme'),
    catalog: null,
    show: function (m) { show(m); },
    saved: function () {
      $('pcSite').contentWindow.location.reload();
      $('mobile').contentWindow.location.reload();
      toast('Каталог сохранён в демо: изменения уже видны на сайте и в телефоне');
    },
    booked: function () { toast('Демо: заявка не отправлена и письмо не ушло'); }
  };

  // Темы
  function applyTheme(t) {
    demo.theme = t;
    document.documentElement.setAttribute('data-theme', t);
    $('themeText').textContent = t === 'dark' ? 'Светлая тема' : 'Тёмная тема';
    frames.forEach(function (f) {
      try { f.contentDocument.documentElement.classList.toggle('demo-dark', t === 'dark'); } catch (e) {}
    });
  }
  $('theme').addEventListener('click', function () {
    var t = demo.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('tyaga_demo_theme', t); } catch (e) {}
    applyTheme(t);
  });
  applyTheme(demo.theme);

  // Сайт / админ-панель
  function show(m) {
    mode = m;
    var admin = m === 'admin';
    if (admin && !$('pcAdmin').getAttribute('src')) $("pcAdmin").src = "site/admin.html";
    $('pcSite').hidden = admin; $('pcAdmin').hidden = !admin;
    $('tabSite').classList.toggle('on', !admin); $('tabAdmin').classList.toggle('on', admin);
    $('tabSite').setAttribute('aria-selected', String(!admin)); $('tabAdmin').setAttribute('aria-selected', String(admin));
    $('tip').textContent = admin ? 'Пароль любой. Поменяйте цену или фото и нажмите «Сохранить»' : 'Выберите инструмент и оформите заявку';
    updateUrl();
  }
  $('tabSite').addEventListener('click', function () { show('site'); });
  $('tabAdmin').addEventListener('click', function () { show('admin'); });

  function updateUrl() {
    var f = mode === 'admin' ? $('pcAdmin') : $('pcSite'), p = '';
    try { p = f.contentWindow.location.pathname.split('/').pop() + f.contentWindow.location.hash; } catch (e) {}
    $('url').textContent = 'tyaga / ' + (p || (mode === 'admin' ? 'admin.html' : 'index.html'));
  }
  frames.forEach(function (f) {
    f.addEventListener('load', function () {
      if (f !== $('mobile')) {
        updateUrl();
        try { f.contentWindow.addEventListener('hashchange', updateUrl); } catch (e) {}
      }
    });
  });

  // Масштаб: компьютер рисуется шириной 1440 px и уменьшается под окно, телефон — под высоту
  function fit() {
    var narrow = innerWidth <= 900;
    var box = $('phoneBox'), ph = $('phone');
    var avail = narrow ? Math.min(innerWidth - 32, PH_W) / PH_W : Math.min(1, box.clientHeight / PH_H);
    if (!narrow && avail * PH_W > innerWidth * 0.34) avail = innerWidth * 0.34 / PH_W;
    ph.style.transform = 'scale(' + avail + ')';
    box.style.width = Math.round(PH_W * avail) + 'px';
    box.style.height = narrow ? Math.round(PH_H * avail) + 'px' : '';
    box.parentNode.style.width = narrow ? '' : Math.round(PH_W * avail) + 'px';
    box.parentNode.style.alignSelf = narrow ? 'center' : '';

    var s = $('screen'), k = s.clientWidth / PC_W;
    [$('pcSite'), $('pcAdmin')].forEach(function (f) {
      f.style.width = PC_W + 'px';
      f.style.height = Math.ceil(s.clientHeight / k) + 'px';
      f.style.transform = 'scale(' + k + ')';
    });
  }
  addEventListener('resize', fit);
  fit(); setTimeout(fit, 0);
})();
</script>
</body>
</html>
